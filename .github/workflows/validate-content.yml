name: Validate content

# Runs on pull requests; on main it runs as part of deploy.yml, which deploys only when it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validator tests and content checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install validation tooling
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Test validator regressions
        run: npm test
